<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผล - สำหรับผู้บริหาร</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #333; text-align: center; margin-bottom: 15px;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; text-align: center; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .complete { color: #28a745; font-weight: bold; }
        .incomplete { color: #dc3545; font-weight: bold; }
        .btn-view { padding: 5px 12px; background-color: #17a2b8; color: white; text-decoration: none; border-radius: 3px; font-size: 13px; cursor: pointer; border: none;}
        .btn-del { background-color: #dc3545; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 13px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-container { position: relative; height: 350px; width: 100%; display: flex; justify-content: center; }
        .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; text-align: center;}
        .login-box button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="loginSection" class="card login-box">
    <h3>🔒 เข้าสู่ระบบผู้บริหาร</h3>
    <input type="password" id="passwordInput" placeholder="ระบุรหัสผ่าน">
    
    <!-- เพิ่มกล่องติ๊กแสดงรหัสผ่าน -->
    <div style="text-align: left; margin-top: -5px; margin-bottom: 15px;">
        <input type="checkbox" id="showPwd" onclick="togglePassword()" style="width: auto; margin-right: 5px; cursor: pointer;">
        <label for="showPwd" style="display: inline; font-size: 14px; font-weight: normal; cursor: pointer; color: #555;">แสดงรหัสผ่าน</label>
    </div>

    <button onclick="checkLogin()">เข้าสู่ระบบ</button>
    <div id="loginError" class="error-msg">รหัสผ่านไม่ถูกต้อง!</div>
</div>
    
    <div class="card" style="overflow-x:auto;">
        <h3>ความคืบหน้าเทียบเป้าหมาย</h3>
        <table>
            <thead>
                <tr>
                    <th>หน่วยงาน/สถานศึกษา</th>
                    <th>เป้าหมาย</th>
                    <th>รายงานแล้ว (ในเป้าหมาย)</th>
                    <th>เพิ่มเติมนอกเป้าหมาย</th>
                    <th>ร้อยละ (%)</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody id="targetTable"></tbody>
        </table>
    </div>

    <div class="grid-2">
        <div class="card" style="overflow-x:auto;">
            <h3>รายละเอียดผู้ที่รายงานแล้ว</h3>
            <table>
                <thead>
                    <tr>
                        <th>หน่วยงาน</th>
                        <th>ชื่อ</th>
                        <th style="width: 150px; text-align:center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>

        <div class="card" style="overflow-x:auto;">
            <h3 style="color:#dc3545;">❌ ผู้ที่ยังไม่ได้รายงาน</h3>
            <table>
                <thead>
                    <tr>
                        <th style="background-color:#dc3545;">หน่วยงาน</th>
                        <th style="background-color:#dc3545;">ชื่อ</th>
                    </tr>
                </thead>
                <tbody id="missingTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);

    // *** นำ Web App URL ของคุณมาใส่ที่นี่ (ลิงก์เดิมได้เลย) ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx9_Mgzm-NQKb50QT2eobc5877xfD7ViT4KCvAMk-etkPnWPYfsDjmuSYE9nN5odn7y/exec'; 
    let globalRole = '';
    
    let currentChartStatus = null;
    let currentChartTarget = null;

    const accessRoles = {
        'admin1234': 'all', 'muang01': 'เมืองลำพูน', 'maetha02': 'แม่ทา', 
        'banhong03': 'บ้านโฮ่ง', 'lee04': 'ลี้', 'thunghua05': 'ทุ่งหัวช้าง', 
        'pasang06': 'ป่าซาง', 'banthi07': 'บ้านธิ', 'wiang08': 'เวียงหนองล่อง'
    };

    // ฟังก์ชันสลับการแสดงรหัสผ่าน
    function togglePassword() {
        const pwdInput = document.getElementById('passwordInput');
        if (pwdInput.type === "password") {
            pwdInput.type = "text";
        } else {
            pwdInput.type = "password";
        }
    }

    document.getElementById("passwordInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { event.preventDefault(); checkLogin(); }
    });

    function fetchData() {
        Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        const cachedData = localStorage.getItem('eduPass_dashData');
        if (cachedData) renderDashboard(JSON.parse(cachedData));

        fetch(scriptURL + "?action=getReport")
            .then(res => res.json())
            .then(data => { 
                localStorage.setItem('eduPass_dashData', JSON.stringify(data));
                renderDashboard(data); 
                Swal.close(); 
            })
            .catch(err => { Swal.close(); console.error(err); });
    }

    function renderDashboard(data) {
        let reports = data.reports;
        let targets = data.targets;
        let employees = data.employees;

        if (globalRole !== 'all') {
            reports = reports.filter(r => r.agency && r.agency.includes(globalRole));
            targets = targets.filter(t => t.amphoe && t.amphoe.includes(globalRole));
            employees = employees.filter(e => e.agency && e.agency.includes(globalRole));
        }

        let targetData = {};
        let reportedNamesSet = new Set(); 
        let totalTargetAll = 0;
        let totalActualTargetAll = 0;
        
        const targetEmployeeNames = employees.map(e => e.name.trim()); 

        targets.forEach(t => { 
            targetData[t.amphoe.trim()] = { target: t.target, actualTarget: 0, extra: 0 }; 
            totalTargetAll += t.target;
        });
        
        reports.forEach(r => {
            let agency = r.agency ? r.agency.trim() : "-";
            let name = r.name ? r.name.trim() : "-";
            
            if (targetData[agency] !== undefined) {
                if (targetEmployeeNames.includes(name)) {
                    targetData[agency].actualTarget++;
                    totalActualTargetAll++;
                } else {
                    targetData[agency].extra++; 
                }
            }
            reportedNamesSet.add(name);
        });

        const targetTable = document.getElementById('targetTable');
        targetTable.innerHTML = '';
        let chartLabels = []; let chartTargets = []; let chartActuals = [];
        
        for (let amp in targetData) {
            let d = targetData[amp];
            let pct = d.target > 0 ? ((d.actualTarget / d.target) * 100).toFixed(1) : 0;
            if(pct > 100) pct = 100;
            let isComplete = d.actualTarget >= d.target;
            
            targetTable.innerHTML += `<tr>
                <td>${amp}</td>
                <td style="text-align:center;">${d.target}</td>
                <td style="text-align:center; color:#28a745; font-weight:bold;">${d.actualTarget}</td>
                <td style="text-align:center; color:#17a2b8; font-weight:bold;">+${d.extra}</td>
                <td style="text-align:center;">${pct}%</td>
                <td class="${isComplete ? 'complete' : 'incomplete'}">${isComplete ? 'ครบถ้วน' : `ขาด ${d.target - d.actualTarget}`}</td>
            </tr>`;
            
            chartLabels.push(amp); chartTargets.push(d.target); chartActuals.push(d.actualTarget);
        }

        let totalNotReported = totalTargetAll - totalActualTargetAll;
        if(totalNotReported < 0) totalNotReported = 0;
        
        if(currentChartStatus) currentChartStatus.destroy();
        currentChartStatus = new Chart(document.getElementById('statusChart').getContext('2d'), {
            type: 'pie',
            data: { labels: ['รายงานแล้ว (ตรงเป้า)', 'ยังไม่ได้รายงาน'], datasets: [{ data: [totalActualTargetAll, totalNotReported], backgroundColor: ['#28a745', '#dc3545'] }] },
            options: { maintainAspectRatio: false, plugins: { datalabels: { color: '#fff', font: { weight: 'bold', size: 14 }, textAlign: 'center',
                formatter: function(value) { let t = totalTargetAll; if(t===0) return '0%'; return value + ' คน\n(' + Math.round((value/t)*100) + '%)'; } } } }
        });

        if(currentChartTarget) currentChartTarget.destroy();
        currentChartTarget = new Chart(document.getElementById('targetChart').getContext('2d'), {
            type: 'bar',
            data: { labels: chartLabels, datasets: [{ label: 'เป้าหมาย (คน)', data: chartTargets, backgroundColor: '#cccccc' }, { label: 'รายงานแล้ว (คน)', data: chartActuals, backgroundColor: '#007bff' }] },
            options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, grace: '10%' } },
                plugins: { datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' },
                    formatter: function(v, ctx) { if(ctx.datasetIndex===1){ let t=ctx.chart.data.datasets[0].data[ctx.dataIndex]; if(t>0) return v+' ('+((v/t)*100).toFixed(0)+'%)'; } return v; } } } }
        });

        const dataTable = document.getElementById('dataTable');
        dataTable.innerHTML = '';
        reports.forEach(row => {
            let extraTag = targetEmployeeNames.includes(row.name.trim()) ? '' : ' <span style="color:orange;font-size:10px;">(นอกกลุ่ม)</span>';
            
            dataTable.innerHTML += `<tr>
                <td>${row.agency}</td>
                <td>${row.name}${extraTag}</td>
                <td style="text-align:center;">
                    <a href="${row.imageUrl}" target="_blank" class="btn-view">🖼️ รูป</a>
                    <button class="btn-del" onclick="deleteRecord(${row.row})">🗑️ ลบ</button>
                </td>
            </tr>`;
        });

        const missingTable = document.getElementById('missingTable');
        missingTable.innerHTML = '';
        let missing = employees.filter(emp => !reportedNamesSet.has(emp.name.trim()));
        missing.forEach(emp => {
            missingTable.innerHTML += `<tr><td>${emp.agency}</td><td>${emp.name}</td></tr>`;
        });
    }

    function deleteRecord(rowNum) {
        Swal.fire({
            title: 'ยืนยันการลบ?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบเลย!', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#dc3545'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                
                fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: 'delete', row: rowNum}) })
                .then(() => { 
                    localStorage.removeItem('eduPass_dashData'); // เคลียร์แคชทันทีที่กดลบ
                    Swal.fire('สำเร็จ', 'ลบข้อมูลแล้ว', 'success'); 
                    fetchData(); 
                })
                .catch(error => Swal.fire('ผิดพลาด', 'ลบข้อมูลไม่สำเร็จ', 'error'));
            }
        });
    }
</script>
</body>
</html>
