<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามการลงทะเบียนแอปพลิเคชัน EduPass ของบุคลากรทางการศึกษา </title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #7dcea0; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #a3e4d7; cursor: not-allowed; }
        .bottom-links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-link { display: block; width: 100%; padding: 10px; text-align: center; text-decoration: none; border-radius: 5px; font-size: 15px; font-weight: bold; box-sizing: border-box; border: 2px solid #007bff; color: #007bff; background: white; transition: 0.3s; }
        .btn-link:hover { background-color: #007bff; color: white; }
        .sample-box { margin-top: 25px; padding: 15px; background-color: #e9ecef; border-radius: 5px; border: 1px dashed #6c757d; text-align: center; }
        .sample-title { font-size: 14px; font-weight: bold; color: #495057; display: block; margin-bottom: 10px; }
        .sample-box img { max-width: 250px; width: 100%; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบติดตามการลงทะเบียนแอปพลิเคชัน<br>Edu Pass ของบุคลากรทางการศึกษา</h2>
    
    <form id="reportForm">
        <!-- 1. หน่วยงาน -->
        <label>หน่วยงาน / สถานศึกษา:</label>
        <input type="text" id="agency" list="agencyList" placeholder="กำลังโหลดข้อมูล..." required autocomplete="off" disabled>
        <datalist id="agencyList"></datalist>

        <!-- 2. ชื่อ-นามสกุล -->
        <label>ชื่อ-นามสกุล:</label>
        <input type="text" id="name" list="nameList" placeholder="กรุณาเลือกหน่วยงานก่อน" required autocomplete="off" disabled>
        <datalist id="nameList"></datalist>

        <!-- 3. ตำแหน่ง -->
        <label>ตำแหน่ง:</label>
        <input type="text" id="position" placeholder="ตำแหน่งจะแสดงอัตโนมัติ" required>

        <label>แนบภาพถ่ายหลักฐาน:</label>
        <input type="file" id="uploadFile" accept="image/*" required>

        <button type="submit" id="submitBtn">ส่งรายงานผล</button>
    </form>

    <!-- ส่วนที่นำกลับมา: ปุ่มลิงก์ด้านล่าง -->
    <div class="bottom-links">
        <a href="https://drive.google.com/file/d/1Tink6szmCclzAvW0iGZSSrtjfdB0rx1A/view?usp=sharing" target="_blank" class="btn-link">📖 คู่มือการลงทะเบียน Edu Pass</a>
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vRMWJfcDmOxV2OidbDpehLTyRVFpGkgpYs-aJ4khAh_aIGHnvlwz6Fj1b2BUsSy050ULGFoYdBeCqzs/pubhtml?gid=221590208&single=true" target="_blank" class="btn-link">📋 รายชื่อกลุ่มเป้าหมาย Edu Pass</a>
        <a href="admin_dashboard.html" class="btn-link">📊 ดูรายงานสรุปผลการลงทะเบียน</a>
    </div>

    <!-- ส่วนที่นำกลับมา: กล่องภาพตัวอย่าง -->
    <div class="sample-box">
        <span class="sample-title">📌 ตัวอย่างไฟล์ภาพหลักฐานที่ต้องแนบ</span>
        <img src="https://i.postimg.cc/htdjx9BF/274910.png" alt="ตัวอย่างหลักฐาน">
    </div>
</div>

<script>
    // *** นำ Web App URL ของคุณที่ Deploy ใหม่มาใส่ที่นี่ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx9_Mgzm-NQKb50QT2eobc5877xfD7ViT4KCvAMk-etkPnWPYfsDjmuSYE9nN5odn7y/exec'; 

    let employeeData = [];
    let reportedNames = []; 

    window.onload = function() {
        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                employeeData = data.employees;
                reportedNames = data.reportedNames;
                
                // ดึงชื่อหน่วยงานที่ไม่ซ้ำกันมาทำตัวเลือก
                const uniqueAgencies = [...new Set(employeeData.map(emp => emp.agency))];
                const agencyList = document.getElementById('agencyList');
                uniqueAgencies.forEach(ag => {
                    let option = document.createElement('option');
                    option.value = ag;
                    agencyList.appendChild(option);
                });
                
                const agencyInput = document.getElementById('agency');
                agencyInput.placeholder = "พิมพ์หรือเลือกหน่วยงาน";
                agencyInput.disabled = false;
            })
            .catch(error => console.error("โหลดข้อมูลล้มเหลว"));
    };

    // เมื่อเลือกหน่วยงาน ให้กรองรายชื่อเฉพาะหน่วยงานนั้น
    document.getElementById('agency').addEventListener('input', function(e) {
        const selectedAgency = e.target.value;
        const dataList = document.getElementById('nameList');
        dataList.innerHTML = ''; 
        
        const filteredEmp = employeeData.filter(emp => emp.agency === selectedAgency);
        filteredEmp.forEach(emp => {
            let option = document.createElement('option');
            option.value = emp.name;
            dataList.appendChild(option);
        });

        const nameInput = document.getElementById('name');
        nameInput.disabled = false;
        nameInput.placeholder = "พิมพ์หรือเลือกรายชื่อ";
        nameInput.value = "";
        document.getElementById('position').value = "";
    });

    // ตรวจสอบชื่อซ้ำ และดึงตำแหน่ง
    document.getElementById('name').addEventListener('input', function(e) {
        const selectedName = e.target.value.trim();
        const btn = document.getElementById('submitBtn');

        // บล็อกชื่อซ้ำเด็ดขาด!
        if (reportedNames.includes(selectedName)) {
            Swal.fire({ icon: 'error', title: 'ไม่อนุญาตให้บันทึก!', text: 'รายชื่อนี้รายงานผลเรียบร้อยแล้ว ไม่สามารถส่งซ้ำได้' });
            btn.disabled = true;
            btn.innerText = "รายชื่อนี้รายงานไปแล้ว";
            btn.style.backgroundColor = "#dc3545";
            return;
        } else {
            btn.disabled = false;
            btn.innerText = "ส่งรายงานผล";
            btn.style.backgroundColor = "#27ae60";
        }

        // ดึงตำแหน่ง
        const foundEmp = employeeData.find(emp => emp.name === selectedName);
        if (foundEmp) document.getElementById('position').value = foundEmp.position || "";
    });

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;

        Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        const fileInput = document.getElementById('uploadFile');
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file); 
        
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > 600) { height = Math.round((height * 600) / width); width = 600; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                const base64Data = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                const selectedName = document.getElementById('name').value.trim();

                const payload = {
                    name: selectedName, position: document.getElementById('position').value,
                    agency: document.getElementById('agency').value, amphoe: "-", 
                    report: "ดำเนินการลงทะเบียนเข้าใช้งานแล้ว", fileData: base64Data, mimeType: 'image/jpeg'
                };

                fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .then(() => {
                    reportedNames.push(selectedName); // เก็บลงความจำชั่วคราวเพื่อบล็อกทันที
                    Swal.fire('บันทึกสำเร็จ!', 'ได้รับรายงานผลเรียบร้อยแล้ว', 'success');
                    document.getElementById('reportForm').reset();
                    document.getElementById('name').disabled = true;
                })
                .catch(error => Swal.fire('ผิดพลาด', 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error'));
            };
        };
    });
</script>
</body>
</html>
