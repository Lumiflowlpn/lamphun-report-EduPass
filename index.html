<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผลการลงทะเบียน Edu Pass สำนักงาน สกร.ประจำจังหวัดลำพูน</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background-color: #7dcea0; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        button:disabled { background-color: #a3e4d7; cursor: not-allowed; }
        
        .bottom-links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-link { display: block; width: 100%; padding: 10px; text-align: center; text-decoration: none; border-radius: 5px; font-size: 15px; font-weight: bold; box-sizing: border-box; border: 2px solid #007bff; color: #007bff; background: white; transition: 0.3s; }
        .btn-link:hover { background-color: #007bff; color: white; }
        
        .sample-box { margin-top: 25px; padding: 15px; background-color: #e9ecef; border-radius: 5px; border: 1px dashed #6c757d; text-align: center; }
        .sample-title { font-size: 14px; font-weight: bold; color: #495057; display: block; margin-bottom: 10px; }
        .sample-box img { max-width: 250px; width: 100%; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบรายงานผลการลงทะเบียน<br>Edu Pass</h2>
    
    <form id="reportForm">
        <label>ชื่อ-นามสกุล (พิมพ์เพื่อค้นหา):</label>
        <input type="text" id="name" list="nameList" placeholder="กำลังโหลดรายชื่อ..." required autocomplete="off" disabled>
        <datalist id="nameList"></datalist>

        <label>ตำแหน่ง:</label>
        <input type="text" id="position" required>

        <label>หน่วยงาน / สถานศึกษา:</label>
        <input type="text" id="agency" required>

        <label>สถานะการดำเนินงาน:</label>
        <select id="report" required>
            <option value="">-- กรุณาเลือกสถานะ --</option>
            <option value="ดำเนินการลงทะเบียนเข้าใช้งานแล้ว">ดำเนินการลงทะเบียนเข้าใช้งานแล้ว</option>
            <option value="ยังไม่สามารถดำเนินงานการได้">ยังไม่สามารถดำเนินงานการได้</option>
        </select>

        <label>แนบภาพถ่ายหลักฐาน:</label>
        <input type="file" id="uploadFile" accept="image/*" required>

        <button type="submit" id="submitBtn">ส่งรายงานผล</button>
    </form>

    <div class="bottom-links">
        <a href="https://drive.google.com/file/d/1Tink6szmCclzAvW0iGZSSrtjfdB0rx1A/view?usp=sharing" target="_blank" class="btn-link">📖 คู่มือการลงทะเบียน Edu Pass</a>
        <a href="dashboard.html" class="btn-link">📊 ดูรายงานสรุปผลการลงทะเบียน</a>
    </div>

    <div class="sample-box">
        <span class="sample-title">📌 ตัวอย่างไฟล์ภาพหลักฐานที่ต้องแนบ</span>
        <!-- รูปภาพตัวอย่าง -->
        <img src="https://i.postimg.cc/htdjx9BF/274910.png" alt="ตัวอย่างหลักฐาน">
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwkEfNEZqsiNGtxSn5Vypnh_r3B7FO_ss8Z_nffKgLG3Xx84Ljwv48pNII6OfcyVutc/exec'; 

    let employeeData = [];

    window.onload = function() {
        const nameInput = document.getElementById('name');
        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                employeeData = data;
                const dataList = document.getElementById('nameList');
                
                data.forEach(emp => {
                    let option = document.createElement('option');
                    option.value = emp.name;
                    dataList.appendChild(option);
                });
                
                nameInput.placeholder = "พิมพ์ชื่อ หรือเลือกจากรายชื่อ";
                nameInput.disabled = false;
            })
            .catch(error => {
                nameInput.placeholder = "โหลดข้อมูลล้มเหลว ลองรีเฟรชหน้าเว็บ";
            });
    };

    document.getElementById('name').addEventListener('input', function(e) {
        const selectedName = e.target.value;
        const positionInput = document.getElementById('position');
        const agencyInput = document.getElementById('agency');
        
        const foundEmp = employeeData.find(emp => emp.name === selectedName);
        
        if (foundEmp) {
            positionInput.value = foundEmp.position || "";
            agencyInput.value = foundEmp.agency || "";
        } else {
            positionInput.value = "";
            agencyInput.value = "";
        }
    });

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'กำลังส่งข้อมูลและไฟล์ภาพ...';
        btn.disabled = true;

        const fileInput = document.getElementById('uploadFile');
        const file = fileInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1]; 

                const payload = {
                    name: document.getElementById('name').value,
                    position: document.getElementById('position').value,
                    agency: document.getElementById('agency').value,
                    amphoe: "-", 
                    report: document.getElementById('report').value,
                    fileData: base64Data,
                    mimeType: file.type
                };

                // ส่งข้อมูลโดยใช้โหมด no-cors เพื่อแก้ปัญหาแจ้งเตือนผิดพลาด
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors', // *** เพิ่มคำสั่งนี้ ***
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    // เมื่อส่งผ่าน ให้อนุมานว่าสำเร็จเลย
                    alert('บันทึกรายงานผลเรียบร้อยแล้ว!');
                    document.getElementById('reportForm').reset();
                    btn.innerText = 'ส่งรายงานผล';
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('ส่งข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
                    btn.innerText = 'ส่งรายงานผล';
                    btn.disabled = false;
                });
            };
            reader.readAsDataURL(file); 
        }
    });
</script>
</body>
</html>
