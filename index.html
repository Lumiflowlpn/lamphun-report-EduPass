<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผลการปฏิบัติงาน</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        .auto-fill-note { font-size: 12px; color: #28a745; margin-top: 2px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบรายงานผลการปฏิบัติงาน</h2>
    
    <form id="reportForm">
        <label>ชื่อ-นามสกุล (พิมพ์เพื่อค้นหา):</label>
        <input type="text" id="name" list="nameList" placeholder="กำลังโหลดรายชื่อ..." required autocomplete="off" disabled>
        <datalist id="nameList"></datalist>

        <label>ตำแหน่ง:</label>
        <!-- เปลี่ยนจาก Select เป็น Input ธรรมดา -->
        <input type="text" id="position" placeholder="จะขึ้นอัตโนมัติเมื่อเลือกชื่อ" required>

        <label>หน่วยงาน / สถานศึกษา:</label>
        <input type="text" id="agency" placeholder="จะขึ้นอัตโนมัติเมื่อเลือกชื่อ" required>

        <label>รายงานผลพื้นที่อำเภอ:</label>
        <select id="amphoe" required>
            <option value="">-- กรุณาเลือกอำเภอ --</option>
            <option value="เมืองลำพูน">เมืองลำพูน</option>
            <option value="แม่ทา">แม่ทา</option>
            <option value="บ้านโฮ่ง">บ้านโฮ่ง</option>
            <option value="ลี้">ลี้</option>
            <option value="ทุ่งหัวช้าง">ทุ่งหัวช้าง</option>
            <option value="ป่าซาง">ป่าซาง</option>
            <option value="บ้านธิ">บ้านธิ</option>
            <option value="เวียงหนองล่อง">เวียงหนองล่อง</option>
        </select>

        <label>สถานะการดำเนินงาน:</label>
        <select id="report" required>
            <option value="">-- กรุณาเลือกสถานะ --</option>
            <option value="ดำเนินการลงทะเบียนเข้าใช้งานแล้ว">ดำเนินการลงทะเบียนเข้าใช้งานแล้ว</option>
            <option value="ยังไม่สามารถดำเนินงานการได้">ยังไม่สามารถดำเนินงานการได้</option>
        </select>

        <label>แนบภาพถ่ายหลักฐาน:</label>
        <input type="file" id="uploadFile" accept="image/*" required>

        <button type="submit" id="submitBtn">ส่งรายงานผล</button>
    </form>
</div>

<script>
    // *** นำ Web App URL อันใหม่ที่ Deploy มาใส่ตรงนี้ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwkEfNEZqsiNGtxSn5Vypnh_r3B7FO_ss8Z_nffKgLG3Xx84Ljwv48pNII6OfcyVutc/exec'; 

    let employeeData = []; // ตัวแปรเก็บข้อมูลพนักงานทั้งหมด

    window.onload = function() {
        const nameInput = document.getElementById('name');
        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                employeeData = data; // เก็บข้อมูลที่โหลดมาไว้
                const dataList = document.getElementById('nameList');
                
                data.forEach(emp => {
                    let option = document.createElement('option');
                    option.value = emp.name;
                    dataList.appendChild(option);
                });
                
                nameInput.placeholder = "พิมพ์ชื่อ หรือเลือกจากรายชื่อ";
                nameInput.disabled = false;
            })
            .catch(error => {
                nameInput.placeholder = "โหลดข้อมูลล้มเหลว ลองรีเฟรชหน้าเว็บ";
            });
    };

    // ฟังก์ชันตรวจจับการพิมพ์/เลือกชื่อ เพื่อเติมข้อมูลอัตโนมัติ
    document.getElementById('name').addEventListener('input', function(e) {
        const selectedName = e.target.value;
        const positionInput = document.getElementById('position');
        const agencyInput = document.getElementById('agency');
        
        // ค้นหาชื่อที่ตรงกับที่ผู้ใช้พิมพ์ในฐานข้อมูล
        const foundEmp = employeeData.find(emp => emp.name === selectedName);
        
        if (foundEmp) {
            positionInput.value = foundEmp.position || "";
            agencyInput.value = foundEmp.agency || "";
        } else {
            // ถ้าลบชื่อออก หรือพิมพ์ชื่อใหม่ที่ไม่มีในระบบ ให้ล้างช่องทิ้งเพื่อให้กรอกเองได้
            positionInput.value = "";
            agencyInput.value = "";
        }
    });

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'กำลังส่งข้อมูลและไฟล์ภาพ...';
        btn.disabled = true;

        const fileInput = document.getElementById('uploadFile');
        const file = fileInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1]; 

                const payload = {
                    name: document.getElementById('name').value,
                    position: document.getElementById('position').value,
                    agency: document.getElementById('agency').value,
                    amphoe: document.getElementById('amphoe').value,
                    report: document.getElementById('report').value,
                    fileData: base64Data,
                    mimeType: file.type
                };

                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('บันทึกรายงานผลเรียบร้อยแล้ว!');
                        document.getElementById('reportForm').reset();
                    } else {
                        alert('เกิดข้อผิดพลาด: ' + data.message);
                    }
                    btn.innerText = 'ส่งรายงานผล';
                    btn.disabled = false;
                });
            };
            reader.readAsDataURL(file); 
        }
    });
</script>
</body>
</html>
